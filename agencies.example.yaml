# Target list for a prospecting run.
#
# Copy to agencies.yaml (or pass any path with --agencies) and edit.
# The example below is the real target list from the project this tool was built
# for: a small hospitality operator looking for B2B partners in one overseas market
# Every company named below is invented.

# Geographic anchor added to every query.
location: Dubai

# Seniority / function keywords. These are OR-ed together inside one query, so
# adding more widens recall per query without costing extra quota.
roles:
  - MICE
  - Incentive
  - Events
  - Concierge
  - Bespoke
  - Outbound
  - Director
  - Head of

agencies:
  # --- Boutique & bespoke travel ---
  - name: Falcon Bay Travel
    segment: boutique
  - name: FalconBayTravel
    segment: boutique
  - name: Oryx & Compass Travel
    segment: boutique
  - name: Silk Lantern Journeys
    segment: boutique

  # --- MICE & incentive ---
  - name: Lantern Court Incentives
    segment: mice
  - name: Dune & Palm Events
    segment: mice
  - name: Majlis Concierge
    segment: mice
  - name: Sandstone Meetings Group
    segment: mice
  - name: GulfCo Events
    segment: mice
  - name: Zephyr Incentive Works
    segment: mice

  # --- Luxury concierge ---
  - name: Ivory Key Club
    segment: concierge
  - name: Ivory Key Club
    segment: concierge
  - name: Verdigris Concierge
    segment: concierge
  - name: Palm Atrium Concierge
    segment: concierge
