# A search brief: everything that defines one search, in one file.
#
# Copy to search.yaml (or pass any path with --search) and edit. To retarget the
# tool at a different country, sector or seniority, this is the only file you
# need to touch -- .env holds API keys and infrastructure, nothing about *what*
# you are looking for.
#
# The example below is a complete brief in company mode, of the shape this tool
# was built for: a small hospitality operator looking for B2B partners in one
# overseas market. Every company named here is invented -- replace the list with
# your own targets before you run anything.

# ---------------------------------------------------------------------------
# What to search for
# ---------------------------------------------------------------------------

# Geographic anchor added to every query, as a quoted phrase.
location: Dubai

# Country and language bias for the search engine itself (Serper `gl` / `hl`).
# Set these deliberately: a Warsaw search left on `ae` will quietly favour
# Emirati results. Use an ISO country code, e.g. pl, de, gb, us.
country: ae
language: en

# Seniority and function keywords. These are OR-ed together inside ONE query,
# so adding more widens recall per query without costing extra quota.
roles:
  - MICE
  - Incentive
  - Events
  - Concierge
  - Bespoke
  - Outbound
  - Director
  - Head of

# Optional second OR-group, AND-ed with the roles above. Use it to narrow by
# specialism without diluting the role list, e.g. ["luxury", "eco-tourism"].
# Leave empty to skip it entirely.
keywords: []

# ---------------------------------------------------------------------------
# How deep, and how strict
# ---------------------------------------------------------------------------

# Result pages to fetch per company. Each page is one billed query, so the
# worst case for a run is (agencies x max_pages). Pagination stops early on an
# empty or short page. Override for one run with --pages.
max_pages: 3

# Drop prospects scoring below this before writing the CSV. 0.0 keeps
# everything and relies on the "Needs review" column instead, which is usually
# what you want on a first pass. Override for one run with --min-confidence.
min_confidence: 0.0

# Terms that disqualify a result, applied to every target below. They become
# negative search terms AND are re-checked when scoring, because a search engine
# honours negative terms unreliably on phrases with few matches. Leave empty
# unless you have seen the noise you are excluding.
exclude: []

# ---------------------------------------------------------------------------
# Who to search for
# ---------------------------------------------------------------------------
# `name` is used as a quoted phrase in the query and matched against result
# titles and snippets. `segment` is a free-text label copied to the CSV.
#
# `kind` decides how a match is read, and defaults to `company`:
#
#   company  an employer. A match in the result title means "works here now",
#            because that is what a LinkedIn profile title states.
#   phrase   a self-description such as "konsultant slubny". A match means
#            "this is how the person presents themselves" -- the more useful
#            question when the market is a long tail of sole traders with no
#            company worth naming. See docs/DECISIONS.md, ADR-009.
#
# Phrase targets need the LOCAL wording. `country` biases ranking but does not
# restrict language: the English "wedding planner" with country: pl returns
# American planners, while the Polish "wedding plannerka" returns Polish ones.
# The tool warns about this at load time.

targets:
  # --- Boutique & bespoke travel ---
  - name: Falcon Bay Travel
    segment: boutique
  - name: Silk Lantern Journeys
    segment: boutique
  - name: Oryx & Compass Travel
    segment: boutique
  - name: Northwind Bespoke Travel
    segment: boutique

  # --- MICE & incentive ---
  - name: Dune & Palm Events
    segment: mice
  - name: GulfCo Events
    segment: mice
  - name: Lantern Court Incentives
    segment: mice
  - name: The Amber Quarter Events
    segment: mice
  - name: Sandstone Meetings Group
    segment: mice
  - name: Zephyr Incentive Works
    segment: mice

  # --- Luxury concierge ---
  - name: Ivory Key Club
    segment: concierge
  - name: Majlis Concierge
    segment: concierge
  - name: Verdigris Concierge
    segment: concierge
  - name: Palm Atrium Concierge
    segment: concierge

  # --- Phrase targets: find a category, not a company ---
  # Commented out because this example brief targets named Dubai companies.
  # Uncomment to see the other mode.
  #
  # - name: luxury concierge
  #   kind: phrase
  #   segment: self-described
  #   exclude:
  #     - recruiter        # people hiring for the role, not doing it
